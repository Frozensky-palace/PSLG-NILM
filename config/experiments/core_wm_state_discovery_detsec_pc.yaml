# Formal state discovery config (Phase C2): train cycles -> prim-glr
# segmentation -> detsec_pc features -> KMeans k=3/4/5 -> state merge.
# Consumed by scripts/train_state_discovery.py. The pilot library
# (state_library_pilot_k*_v1) used physical_stats; this config defines the
# formal detsec_pc run. Freeze decisions live in
# docs/state_and_b2_policy_freeze_v1.md and do NOT preselect the outcome:
# detsec_pc may support k=4 or prove k=5 more suitable.
run:
  appliance: washing_machine

paths:
  segments_dir: reports/core_validation/ukdale_b1_washing_machine/real_cycle_library_train_v1/segments
  cache_dir: .cache

state_discovery:
  k_candidates: [3, 4, 5]
  seed: 42
  feature_model: detsec_pc
  segment_method: prim-glr
  cluster_method: kmeans
  sample_seconds: 6
  cycle_library_dir: reports/core_validation/ukdale_b1_washing_machine/real_cycle_library_train_v1

time_segmentation:
  window_size: 30
  n_regimes: 2
  excl_factor: 4
  clasp_n_jobs: 1
  clasp_n_segments: learn
  # Risk-register note: audit per-cycle reconstruction coverage (the state
  # library builder asserts exact coverage); revisit if blocks look truncated.
  max_seg_len: 1536

feature_extract:
  latent_dim: 16
  embed_dim: 32
  lambda_phy: 0.1
  nonneg_channels: [0, 1, 2, 3]
  norm_mode: minmax
  embed_proj: relu
  tf_ratio: 0.0
  tf_schedule: linear
  epochs: 50
  batch_size: 8
  learning_rate: 0.0001
  patience: 10
  cache: true

time_clustering:
  normalization_method: zscore
  col_index: 2
  metric: euclidean
  method_specific:
    kmeans: {n_init: 30, max_iter: 300, random_state: 42}

temporal_state_merge:
  merge_mode: same_label_plus_similar
  enable_similar_merge: true
  similar_feature_tol: 2.0
  min_block_seconds: 90
  fs: 0.1666667
