# pslg-detsec: C2 DETSEC-PC environment with TensorFlow GPU (guide §4.5).
# STATUS: 服务器已验证（2026-09-21，h104-slurm-a RTX3090，驱动 580.65.06）：
# TF 2.18.1 自行枚举 GPU 并通过前向/反向冒烟。偏离记录：装后补
# PyWavelets（prim-glr 分段依赖，初版漏列；服务器实装 1.10.0）。
# Create on the server (Linux; module versions must be confirmed with
# `module avail` first, guide §7.7):
#   conda env create -f environment_detsec_server.yml
#   conda activate pslg-detsec
#   python -c "import tensorflow as tf; print(tf.config.list_physical_devices('GPU'))"
# tensorflow[and-cuda] installs the pip CUDA/cuDNN libraries matching the
# wheel; the system driver only needs to be new enough (guide §7.8: pass only
# when TensorFlow itself lists the GPU, not when nvidia-smi alone works).
# numpy<2 is a repo-wide constraint; TF 2.18.x is the newest series that
# keeps it (2.19+ pulls numpy>=2).
name: pslg-detsec
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url=https://pypi.org/simple
      - numpy<2
      - pandas>=2.2
      - scipy>=1.11
      - scikit-learn>=1.5
      - matplotlib>=3.9
      - pyyaml>=6.0
      - PyWavelets>=1.6
      - tensorflow[and-cuda]==2.18.1
